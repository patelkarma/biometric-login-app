spring.application.name=backend
server.port=8080

# H2 file database: zero setup for reviewers, data survives restarts.
spring.datasource.url=jdbc:h2:file:./data/biometricdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# ---------- Email delivery of 6-digit codes (optional) ----------
# Set MAIL_USERNAME and MAIL_PASSWORD (a Gmail "App password") to send real emails.
# When they are not set, codes are printed in this console and shown on screen as "Demo delivery".
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# ---------- One-time codes ----------
app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=30

# ---------- Sessions (one active device per user) ----------
app.session.ttl-days=7

# ---------- WebAuthn / biometrics ----------
# rp-id must be the hostname the browser shows. localhost works without HTTPS.
app.webauthn.rp-id=localhost
app.webauthn.rp-name=SecureID
app.webauthn.origins=http://localhost:5173,http://localhost:8080

# ---------- CORS (only needed when running the Vite dev server) ----------
app.cors.origins=http://localhost:5173
